<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PinTotalDownload</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    p { margin: 0 0 12px; color: #444; }
    button { width: 100%; padding: 10px; border: none; border-radius: 999px; background: #e60023; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:disabled { background: #bbb; cursor: default; }
    label { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
    hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>PinTotalDownload</h1>
  <p id="status">Verificando a página…</p>
  <button id="go" disabled>⬇ Baixar pasta inteira</button>
  <hr>
  <label><input type="checkbox" id="sections"> Incluir seções da pasta</label>
  <label><input type="checkbox" id="videos"> Baixar vídeos (mp4)</label>
  <script src="popup.js"></script>
</body>
</html>
